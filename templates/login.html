<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Data Query — Acesso</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: system-ui, -apple-system, sans-serif;
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background-color: #0a0a0a;
    background-image:
      linear-gradient(rgba(37,99,235,.08) 1px, transparent 1px),
      linear-gradient(90deg, rgba(37,99,235,.08) 1px, transparent 1px),
      linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
    background-size: 80px 80px, 80px 80px, 16px 16px, 16px 16px;
    color: #d4d4d8;
  }

  .card {
    position: relative;
    width: 100%; max-width: 380px;
    background: #111;
    border: 1px solid #1e1e1e;
    border-top: 2px solid #2563eb;
    border-radius: 8px;
    padding: 2.25rem 2.5rem 2rem;
    box-shadow: 0 0 60px rgba(0,0,0,.9), 0 0 0 1px rgba(37,99,235,.07);
  }

  /* corner accent */
  .card::after {
    content: '';
    position: absolute; top: 0; right: 0;
    width: 55px; height: 55px;
    border-top: 1px solid rgba(37,99,235,.3);
    border-right: 1px solid rgba(37,99,235,.3);
    border-radius: 0 6px 0 0;
    pointer-events: none;
  }

  .badge {
    display: inline-block; margin-bottom: 1.75rem;
    font-size: .62rem; font-family: ui-monospace, monospace;
    color: #3b82f6; background: rgba(37,99,235,.08);
    border: 1px solid rgba(37,99,235,.2);
    border-radius: 3px; padding: .12rem .5rem;
    letter-spacing: .08em; text-transform: uppercase;
  }

  .logo { display: flex; align-items: center; gap: .7rem; margin-bottom: 2rem; }

  .logo-icon {
    flex-shrink: 0;
    width: 34px; height: 34px; border-radius: 7px;
    background: rgba(37,99,235,.1);
    border: 1px solid rgba(37,99,235,.2);
    display: flex; align-items: center; justify-content: center;
  }
  .logo-icon svg {
    width: 16px; height: 16px;
    stroke: #3b82f6; fill: none; stroke-width: 1.5;
    stroke-linecap: round; stroke-linejoin: round;
  }

  .logo-text h1 { font-size: 1.05rem; font-weight: 600; color: #f0f0f0; }
  .logo-text p  {
    font-size: .68rem; color: #52525b;
    font-family: ui-monospace, monospace; margin-top: .1rem;
  }

  label {
    display: block; margin-bottom: .4rem;
    font-size: .72rem; font-family: ui-monospace, monospace;
    letter-spacing: .06em; text-transform: uppercase; color: #71717a;
  }

  input[type=password] {
    width: 100%; padding: .65rem .8rem; font-size: .95rem;
    background: #0d0d0d; color: #e5e5e5;
    border: 1px solid #2a2a2a; border-radius: 6px; outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  input[type=password]:focus {
    border-color: #2563eb;
    box-shadow: 0 0 0 3px rgba(37,99,235,.12);
  }
  input[type=password]::placeholder { color: #333; }

  button {
    width: 100%; margin-top: 1.25rem; padding: .65rem;
    font-size: .875rem; font-weight: 500; letter-spacing: .02em;
    background: #2563eb; color: #fff;
    border: none; border-radius: 6px; cursor: pointer;
    transition: background .15s;
  }
  button:hover { background: #1d4ed8; }

  .error {
    margin-bottom: 1.25rem;
    background: rgba(239,68,68,.07); color: #f87171;
    border: 1px solid rgba(239,68,68,.2); border-radius: 6px;
    padding: .55rem .75rem; font-size: .82rem;
  }
</style>
</head>
<body>
<div class="card">
  <div class="badge">Bauru · Imóveis</div>
  <div class="logo">
    <div class="logo-icon">
      <svg viewBox="0 0 24 24">
        <rect x="3" y="3" width="18" height="18" rx="2"/>
        <line x1="3"  y1="9"  x2="21" y2="9"/>
        <line x1="3"  y1="15" x2="21" y2="15"/>
        <line x1="9"  y1="3"  x2="9"  y2="21"/>
      </svg>
    </div>
    <div class="logo-text">
      <h1>Data Query</h1>
      <p>acesso restrito</p>
    </div>
  </div>
  {% if error %}
  <div class="error">{{ error }}</div>
  {% endif %}
  <form method="post" action="/login">
    <label for="pw">Senha</label>
    <input type="password" id="pw" name="password" placeholder="••••••••" autofocus required>
    <button type="submit">Entrar</button>
  </form>
</div>
</body>
</html>
