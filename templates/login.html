<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Imóveis Bauru — Acesso</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: #f4f4f5;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh;
  }
  .card {
    background: #fff;
    border-radius: 10px;
    padding: 2rem 2.25rem;
    width: 100%; max-width: 360px;
    box-shadow: 0 1px 6px rgba(0,0,0,.1);
  }
  h1 { font-size: 1.15rem; font-weight: 600; color: #111; margin-bottom: 1.5rem; }
  label { display: block; font-size: .85rem; color: #555; margin-bottom: .35rem; }
  input[type=password] {
    width: 100%; padding: .6rem .75rem; font-size: 1rem;
    border: 1px solid #d4d4d8; border-radius: 6px; outline: none;
  }
  input[type=password]:focus {
    border-color: #2563eb;
    box-shadow: 0 0 0 3px rgba(37,99,235,.15);
  }
  button {
    width: 100%; margin-top: 1rem; padding: .625rem;
    font-size: .95rem; font-weight: 500;
    background: #2563eb; color: #fff;
    border: none; border-radius: 6px; cursor: pointer;
  }
  button:hover { background: #1d4ed8; }
  .error {
    background: #fef2f2; color: #b91c1c;
    border: 1px solid #fecaca; border-radius: 6px;
    padding: .5rem .75rem; font-size: .85rem;
    margin-bottom: 1rem;
  }
</style>
</head>
<body>
<div class="card">
  <h1>Imóveis Bauru</h1>
  {% if error %}
  <div class="error">{{ error }}</div>
  {% endif %}
  <form method="post" action="/login">
    <label for="pw">Senha</label>
    <input type="password" id="pw" name="password" autofocus required>
    <button type="submit">Entrar</button>
  </form>
</div>
</body>
</html>
